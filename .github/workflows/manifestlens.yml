name: ManifestLens

# Two jobs, to show the two ways to use the action:
#   everything: judges every manifest in the repository, but only reports (never fails).
#   only-new:   judges only what this pull request introduces, and fails the build on a warning.
on:
  pull_request:
    paths:
      - '**/*.yaml'
      - '**/*.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # lets the action post its pull request comments

concurrency:
  group: manifestlens-${{ github.ref }}
  cancel-in-progress: true

jobs:
  everything:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prsurve/manifestlens@v1
        with:
          label: everything
          mode: report

  only-new:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scope: new needs the base commit
      - uses: prsurve/manifestlens@v1
        with:
          label: only-new
          scope: new
          fail-on: warning # overrides fail-on: error from .github/manifestlens.yml
