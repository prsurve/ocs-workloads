apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    appname: dd-io-3
    workloadpattern: simple_io
  name: dd-io-3
spec:
  selector:
    matchLabels:
      workload: dd-io-3
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        workload: dd-io-3
    spec:
      containers:
      - command:
        - sh
        - -c
        - /run-io.sh
        image: quay.io/prsurve/busybox:latest
        imagePullPolicy: Always
        name: busybox
        env:
        - name: NAMESPACE_WA
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: GPG_PASSPHRASE
          value: ocsqe@123
        - name: GNUPGHOME
          value: /tmp/.gnupg
        volumeMounts:
        - mountPath: /mnt/test
          name: mypvc
      volumes:
      - name: mypvc
        persistentVolumeClaim:
          claimName: dd-io-pvc-3
          readOnly: false
